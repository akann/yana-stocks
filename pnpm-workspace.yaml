packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  bufferutil: true
  es5-ext: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.17'
  - '@turbo/darwin-arm64@2.9.17'
  - '@turbo/linux-64@2.9.17'
  - '@turbo/linux-arm64@2.9.17'
  - '@turbo/windows-64@2.9.17'
  - '@turbo/windows-arm64@2.9.17'
  - prettier@3.8.4
  - turbo@2.9.17
overrides:
  '@types/react': ^18.3.18
  '@types/react-dom': ^18.3.5
  multer: ^2.2.0
  postcss: ^8.5.10

# GHSA-h67p-54hq-rp68 targets js-yaml v4 <=4.1.1; @istanbuljs/load-nyc-config
# pulls in js-yaml v3 (^3.13.1) — different major, different API. False positive.
auditConfig:
  ignoreCves:
    - GHSA-h67p-54hq-rp68
