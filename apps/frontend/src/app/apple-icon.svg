<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#0f172a"/>
  <!-- Bar chart columns -->
  <rect x="22"  y="122" width="24" height="36" rx="5" fill="#1d4ed8" opacity="0.6"/>
  <rect x="56"  y="96"  width="24" height="62" rx="5" fill="#2563eb" opacity="0.75"/>
  <rect x="90"  y="68"  width="24" height="90" rx="5" fill="#3b82f6" opacity="0.9"/>
  <rect x="124" y="32"  width="24" height="126" rx="5" fill="#60a5fa"/>
  <!-- Trend line -->
  <polyline
