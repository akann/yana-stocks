<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- Bar chart columns (left to right, ascending) -->
  <rect x="4"  y="22" width="4" height="6"  rx="1" fill="#1d4ed8" opacity="0.6"/>
  <rect x="10" y="17" width="4" height="11" rx="1" fill="#2563eb" opacity="0.75"/>
  <rect x="16" y="12" width="4" height="16" rx="1" fill="#3b82f6" opacity="0.9"/>
  <rect x="22" y="6"  width="4" height="22" rx="1" fill="#60a5fa"/>
  <!-- Trend line overlaid -->
  <polyline
    points="6,21 12,16 18,11 24,5"
    stroke="#22c55e"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrow head on trend line -->
  <polyline
    points="20,4 24,5 23,9"
    stroke="#22c55e"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
