server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    location = / {
        index index.html;
    }

    location = /portfolio-api {
        try_files /portfolio-api.html =404;
    }

    location = /portfolio-service {
        try_files /portfolio-service.html =404;
    }

    location = /profile-service {
        try_files /profile-service.html =404;
    }

    location = /price-processor {
        try_files /price-processor.html =404;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain always;
    }

    location / {
        return 404;
    }
}
