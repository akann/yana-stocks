server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    # Inject nav CSS + bootstrap script into every HTML page
    sub_filter '</head>' '<style>
#yn{position:fixed;top:0;left:0;right:0;z-index:99999;height:36px;background:#0f172a;display:flex;align-items:center;padding:0 12px;gap:2px;font:13px/1 system-ui,sans-serif;box-shadow:0 1px 0 rgba(255,255,255,.1)}
#yn a{color:#94a3b8;text-decoration:none;padding:0 10px;height:36px;display:flex;align-items:center;border-radius:3px;white-space:nowrap;transition:background .15s,color .15s}
#yn a:hover{background:rgba(255,255,255,.08);color:#e2e8f0}
#yn a.cur{background:rgba(99,102,241,.3);color:#a5b4fc}
#yn .home{color:#e2e8f0;font-weight:600;margin-right:6px}
#yn .sep{width:1px;height:16px;background:#1e293b;margin:0 4px;flex-shrink:0}
body{padding-top:36px!important;margin-top:0!important}
</style>
<script>
(function(){
  function buildNav(){
    var links=[
      {href:"/",label:"YanaStocks Docs",cls:"home"},
      {sep:true},
      {href:"/portfolio-api",label:"Portfolio API"},
      {href:"/portfolio-service",label:"Portfolio Service"},
      {href:"/profile-service",label:"Profile Service"},
      {href:"/price-processor",label:"Price Processor"},
      {href:"/auth-service",label:"Auth Service"}
    ];
    var nav=document.createElement("nav");
    nav.id="yn";
    var p=location.pathname.replace(/\/+$/,"");
    links.forEach(function(l){
      if(l.sep){var d=document.createElement("div");d.className="sep";nav.appendChild(d);return;}
      var a=document.createElement("a");
      a.href=l.href;
      a.textContent=l.label;
      if(l.cls)a.className=l.cls;
      if(l.href===p||(p===""&&l.href==="/"))a.classList.add("cur");
      nav.appendChild(a);
    });
    document.body.insertBefore(nav,document.body.firstChild);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",buildNav);
  else buildNav();
})();
</script></head>';
    sub_filter_once on;

    location = / {
        try_files /index.html =404;
    }

    location = /portfolio-api {
        try_files /portfolio-api.html =404;
    }

    location = /portfolio-service {
        try_files /portfolio-service.html =404;
    }

    location = /profile-service {
        try_files /profile-service.html =404;
    }

    location = /price-processor {
        try_files /price-processor.html =404;
    }

    location = /auth-service {
        try_files /auth-service.html =404;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain always;
    }

    location / {
        return 404;
    }
}
