server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    # Inject nav assets into every HTML page — no $ or special chars in replacement
    sub_filter '</head>' '<link rel="stylesheet" href="/nav.css"><script src="/nav.js"></script></head>';
    sub_filter_once on;

    location = / {
        try_files /index.html =404;
    }

    location = /portfolio-api {
        try_files /portfolio-api.html =404;
    }

    location = /portfolio-service {
        try_files /portfolio-service.html =404;
    }

    location = /profile-service {
        try_files /profile-service.html =404;
    }

    location = /price-processor {
        try_files /price-processor.html =404;
    }

    location = /auth-service {
        try_files /auth-service.html =404;
    }

    location = /nav.css {
        try_files /nav.css =404;
        add_header Cache-Control "max-age=3600" always;
    }

    location = /nav.js {
        try_files /nav.js =404;
        add_header Cache-Control "max-age=3600" always;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain always;
    }

    location / {
        return 404;
    }
}
