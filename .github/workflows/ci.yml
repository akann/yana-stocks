name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build and push all service images'
        type: boolean
        default: true

permissions:
  contents: read

env:
  REGISTRY: harbor.yanatech.co.uk
  IMAGE_PREFIX: harbor.yanatech.co.uk/yana-stocks
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Detect what changed
  # ─────────────────────────────────────────────────────────────────
  changes:
    runs-on: runners-yana-stocks
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      python: ${{ steps.filter.outputs.python }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - '.github/workflows/**'
            python:
              - 'services/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'
              - '.github/workflows/**'
            user-service:
              - 'apps/user-service/**'
              - 'packages/**'
            price-processor:
              - 'apps/price-processor/**'
              - 'packages/**'
            portfolio-service:
              - 'apps/portfolio-service/**'
              - 'packages/**'
            portfolio-api:
              - 'apps/portfolio-api/**'
              - 'packages/**'
            price-ingestor:
              - 'services/price-ingestor/**'
            sentiment-analyzer:
              - 'services/sentiment-analyzer/**'
            ml-predictor:
              - 'services/ml-predictor/**'

      # Build the Docker build matrix — always computed, docker job guards main-only
      - id: matrix
        shell: bash
        run: |
          build_all="${{ github.event.inputs.build_all }}"
          changes_json='${{ steps.filter.outputs.changes }}'
          services='[]'

          add() {
            services=$(printf '%s' "$services" | \
              jq --arg n "$1" --arg c "$2" --arg f "$3" \
                '. + [{"name":$n,"context":$c,"dockerfile":$f}]')
          }

          # maybe_add wraps the check in an if/fi so set -e never fires on a
          # non-matching service (which would abort the script early and leave
          # the matrix empty).
          maybe_add() {
            local name="$1" ctx="$2" file="$3"
            if [[ "$build_all" == "true" ]] || \
               echo "$changes_json" | jq -e --arg n "$name" 'contains([$n])' >/dev/null 2>&1; then
              add "$name" "$ctx" "$file"
            fi
          }

          maybe_add "frontend"           "."                           "apps/frontend/Dockerfile"
          maybe_add "user-service"       "."                           "apps/user-service/Dockerfile"
          maybe_add "price-processor"    "."                           "apps/price-processor/Dockerfile"
          maybe_add "portfolio-service"  "."                           "apps/portfolio-service/Dockerfile"
          maybe_add "portfolio-api"      "."                           "apps/portfolio-api/Dockerfile"
          maybe_add "price-ingestor"     "services/price-ingestor"     "services/price-ingestor/Dockerfile"
          maybe_add "sentiment-analyzer" "services/sentiment-analyzer" "services/sentiment-analyzer/Dockerfile"
          maybe_add "ml-predictor"       "services/ml-predictor"       "services/ml-predictor/Dockerfile"

          matrix_json=$(printf '%s' "$services" | jq -c 'unique_by(.name)')
          item_count=$(printf '%s' "$matrix_json" | jq 'length')
          has_changes="false"
          [[ "$item_count" -gt 0 ]] && has_changes="true"
          echo "computed matrix ($item_count items): $matrix_json"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────
  # 2. TypeScript quality (lint + type-check + test)
  # ─────────────────────────────────────────────────────────────────
  ts-quality:
    runs-on: runners-yana-stocks
    needs: changes
    if: needs.changes.outputs.ts == 'true' || github.event.inputs.build_all == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-ts-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-ts-${{ runner.os }}-

      - name: Install dependencies
        # pnpm 11 requires explicit build approval on first install in a fresh env.
        # Run once; if it fails on the build-approval check, approve then retry.
        run: pnpm install --frozen-lockfile || (pnpm approve-builds --all && pnpm install --frozen-lockfile)

      - name: Generate Prisma client
        run: pnpm --filter @yana-stocks/user-service db:generate

      - name: Set Turborepo filter
        id: turbo-filter
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "filter=[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          else
            echo "filter=[HEAD^1]" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, type-check, test
        run: |
          pnpm turbo run lint type-check test \
            --filter='${{ steps.turbo-filter.outputs.filter }}' \
            --concurrency=4

  # ─────────────────────────────────────────────────────────────────
  # 3. Integration tests (Postgres + MongoDB + Redis as service containers)
  #    Kafka is mocked in all three suites — no broker needed in CI.
  # ─────────────────────────────────────────────────────────────────
  integration-test:
    runs-on: runners-yana-stocks
    needs: [changes, ts-quality]
    if: needs.changes.outputs.ts == 'true' || github.event.inputs.build_all == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yana_stocks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || (pnpm approve-builds --all && pnpm install --frozen-lockfile)

      - name: Generate Prisma client
        run: pnpm --filter @yana-stocks/user-service db:generate

      - name: Write .env.test files
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://postgres:password@localhost:5432/yana_stocks_test' \
            'REDIS_URL=redis://localhost:6379' \
            'JWT_SECRET=int-test-jwt-secret' \
            'JWT_EXPIRES_IN=15m' \
            'JWT_REFRESH_SECRET=int-test-refresh-secret' \
            'JWT_REFRESH_EXPIRES_IN=7d' \
            > apps/user-service/.env.test

          printf '%s\n' \
            'MONGODB_URI=mongodb://admin:password@localhost:27017/price_processor_test?authSource=admin' \
            'REDIS_URL=redis://localhost:6379' \
            'KAFKA_BROKERS=localhost:19092' \
            > apps/price-processor/.env.test

          printf '%s\n' \
            'MONGODB_URI=mongodb://admin:password@localhost:27017/portfolio_service_test?authSource=admin' \
            'KAFKA_BROKERS=localhost:19092' \
            > apps/portfolio-service/.env.test

      - name: Run integration tests
        run: pnpm turbo run test:int --concurrency=3

  # ─────────────────────────────────────────────────────────────────
  # 4. E2E tests — full local stack (Postgres + MongoDB + Redis + all services)
  #    Kafka is not available from this runner; producer/consumer start non-blocking.
  # ─────────────────────────────────────────────────────────────────
  e2e:
    runs-on: runners-yana-stocks
    needs: [changes, ts-quality, integration-test]
    if: needs.changes.outputs.ts == 'true' || github.event.inputs.build_all == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: yana_stocks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || (pnpm approve-builds --all && pnpm install --frozen-lockfile)

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - name: Install Playwright browsers
        run: pnpm --filter @yana-stocks/e2e exec playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies
        run: pnpm --filter @yana-stocks/e2e exec playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Generate Prisma client
        run: pnpm --filter @yana-stocks/user-service db:generate

      - name: Write frontend .env.local
        run: |
          printf '%s\n' \
            'NEXT_PUBLIC_API_URL=http://localhost:3004/api' \
            'NEXT_PUBLIC_WS_URL=ws://localhost:3004' \
            > apps/frontend/.env.local

      - name: Build all apps
        run: pnpm turbo run build

      - name: Migrate database
        run: pnpm --filter @yana-stocks/user-service db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/yana_stocks

      - name: Write service .env files
        run: |
          printf '%s\n' \
            'PORT=3001' \
            'DATABASE_URL=postgresql://postgres:password@localhost:5432/yana_stocks' \
            'REDIS_URL=redis://localhost:6379' \
            'JWT_SECRET=e2e-jwt-secret' \
            'JWT_EXPIRES_IN=15m' \
            'JWT_REFRESH_SECRET=e2e-jwt-refresh-secret' \
            'JWT_REFRESH_EXPIRES_IN=7d' \
            'KAFKA_BROKERS=localhost:19092' \
            'CORS_ORIGIN=http://localhost:3000' \
            > apps/user-service/.env

          printf '%s\n' \
            'PORT=3003' \
            'MONGODB_URI=mongodb://admin:password@localhost:27017/yana_stocks?authSource=admin' \
            'KAFKA_BROKERS=localhost:19092' \
            'CORS_ORIGIN=http://localhost:3000' \
            > apps/portfolio-service/.env

          printf '%s\n' \
            'PORT=3004' \
            'MONGODB_URI=mongodb://admin:password@localhost:27017/yana_stocks?authSource=admin' \
            'REDIS_URL=redis://localhost:6379' \
            'KAFKA_BROKERS=localhost:19092' \
            'USER_SERVICE_URL=http://localhost:3001' \
            'PORTFOLIO_SERVICE_URL=http://localhost:3003' \
            'PRICE_PROCESSOR_URL=http://localhost:3002' \
            'ML_PREDICTOR_URL=http://localhost:8000' \
            'CORS_ORIGIN=http://localhost:3000' \
            > apps/portfolio-api/.env

      - name: Start backend services
        run: |
          mkdir -p logs
          pnpm --filter @yana-stocks/user-service      start > logs/user-service.log      2>&1 &
          pnpm --filter @yana-stocks/portfolio-service start > logs/portfolio-service.log 2>&1 &
          pnpm --filter @yana-stocks/portfolio-api     start > logs/portfolio-api.log     2>&1 &
          pnpm --filter @yana-stocks/frontend          start > logs/frontend.log          2>&1 &

      - name: Wait for all services to be ready
        run: |
          wait_for() {
            local url=$1 name=$2
            echo "Waiting for $name at $url..."
            for i in $(seq 1 30); do
              if curl -sf "$url" >/dev/null 2>&1; then
                echo "  $name ready (attempt $i)"
                return 0
              fi
              sleep 2
            done
            echo "ERROR: $name not ready after 60s" >&2
            cat logs/${name}.log 2>/dev/null || true
            return 1
          }
          wait_for http://localhost:3001/health user-service
          wait_for http://localhost:3003/health portfolio-service
          wait_for http://localhost:3004/health portfolio-api
          wait_for http://localhost:3000     frontend

      - name: Seed test data
        run: pnpm seed

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3004/api
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload service logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-service-logs
          path: logs/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────
  # 5. Python quality (ruff + mypy — no pytest to avoid model downloads)
  #    Runs in parallel with integration-test (independent of TS services)
  # ─────────────────────────────────────────────────────────────────
  python-quality:
    runs-on: runners-yana-stocks
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event.inputs.build_all == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: price-ingestor,     path: services/price-ingestor }
          - { name: sentiment-analyzer, path: services/sentiment-analyzer }
          - { name: ml-predictor,       path: services/ml-predictor }
    name: python / ${{ matrix.service.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service.path }}/uv.lock

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: uv sync --frozen

      - name: Ruff check
        working-directory: ${{ matrix.service.path }}
        run: uv run ruff check .

      - name: Mypy
        working-directory: ${{ matrix.service.path }}
        run: uv run mypy src/

  # ─────────────────────────────────────────────────────────────────
  # 6. Build and push Docker images  (main branch only)
  # ─────────────────────────────────────────────────────────────────
  docker:
    runs-on: runners-yana-stocks
    needs: [changes, ts-quality, integration-test, e2e, python-quality]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.has_changes == 'true' &&
      (needs.ts-quality.result        == 'success' || needs.ts-quality.result        == 'skipped') &&
      (needs.integration-test.result  == 'success' || needs.integration-test.result  == 'skipped') &&
      (needs.e2e.result               == 'success' || needs.e2e.result               == 'skipped') &&
      (needs.python-quality.result    == 'success' || needs.python-quality.result    == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: ${{ fromJson(needs.changes.outputs.matrix) }}
    name: docker / ${{ matrix.service.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        run: |
          echo "=== DOCKER_HOST from pod env ===" && echo "${DOCKER_HOST:-not set}"
          echo "=== Listening TCP ports ===" && ss -tlnp 2>/dev/null || true
          echo "=== /var/run contents ===" && ls -la /var/run/ 2>/dev/null || true

          install_docker_cli() {
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
              -o /etc/apt/keyrings/docker.asc 2>/dev/null
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
              https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends docker-ce-cli >/dev/null
          }

          # Probe for up to 60 s; check both Unix socket (containerMode=dind) and TCP
          for i in $(seq 1 30); do
            # Unix socket — used by containerMode.type=dind
            if curl -sf --max-time 2 --unix-socket /var/run/docker.sock \
                http://localhost/_ping >/dev/null 2>&1; then
              echo "Docker socket ready (attempt $i)"
              install_docker_cli
              echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
              exit 0
            fi
            # TCP — used by manual DinD on 2375
            if curl -sf --max-time 2 http://localhost:2375/_ping >/dev/null 2>&1; then
              echo "Docker TCP ready (attempt $i)"
              install_docker_cli
              echo "DOCKER_HOST=tcp://localhost:2375" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "  attempt $i: not ready yet"
            sleep 2
          done
          echo "ERROR: Docker not reachable after 60 s" >&2
          exit 1

      - uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          build-args: |
            ${{ matrix.service.name == 'frontend' && 'NEXT_PUBLIC_API_URL=https://api-gateway.yanatech.co.uk/api' || '' }}
            ${{ matrix.service.name == 'frontend' && 'NEXT_PUBLIC_WS_URL=wss://api-gateway.yanatech.co.uk' || '' }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max

  # ─────────────────────────────────────────────────────────────────
  # 7. GitOps: update image tags in k8s-apps → ArgoCD auto-syncs
  # ─────────────────────────────────────────────────────────────────
  gitops:
    runs-on: runners-yana-stocks
    needs: [changes, docker]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.docker.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: akann/k8s-apps
          token: ${{ secrets.GH_PAT }}
          path: k8s-apps

      - name: Install yq
        run: |
          mkdir -p $HOME/.local/bin
          curl -fsSL -o $HOME/.local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          chmod +x $HOME/.local/bin/yq
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update deployment image tags
        env:
          SHA: ${{ github.sha }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          cd k8s-apps
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          changed=0
          for svc in $(echo "$MATRIX" | jq -r '.[].name'); do
            # ml-predictor uses an Argo Rollout; all other services use a Deployment
            if [[ -f "apps/yana-stocks/${svc}/rollout.yaml" ]]; then
              manifest="apps/yana-stocks/${svc}/rollout.yaml"
            else
              manifest="apps/yana-stocks/${svc}/deployment.yaml"
            fi
            if [[ -f "$manifest" ]]; then
              yq e ".spec.template.spec.containers[0].image = \"${{ env.IMAGE_PREFIX }}/${svc}:${SHA}\"" \
                -i "$manifest"
              # Also update initContainers if any exist in this manifest
              ic_count=$(yq e '.spec.template.spec.initContainers | length' "$manifest" 2>/dev/null || echo 0)
              if [[ "${ic_count:-0}" -gt 0 ]]; then
                yq e ".spec.template.spec.initContainers[0].image = \"${{ env.IMAGE_PREFIX }}/${svc}:${SHA}\"" \
                  -i "$manifest"
              fi
              changed=1
            fi
          done

          if [[ $changed -eq 1 ]]; then
            git add apps/yana-stocks/
            git commit -m "ci(yana-stocks): update images → $(echo "$SHA" | cut -c1-7)"
            git push
          fi