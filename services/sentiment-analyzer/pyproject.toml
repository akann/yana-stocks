[project]
name = "sentiment-analyzer"
version = "0.0.1"
description = "Consumes news feed, runs FinBERT NLP, publishes sentiment signals to Kafka"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6.0",
    "transformers>=4.47.0",
    "torch>=2.5.0",
    "pymongo>=4.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "bandit>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
